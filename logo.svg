<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41CD52"/>
      <stop offset="1" stop-color="#1E9E33"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF6EC"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- browser window -->
  <g>
    <rect x="36" y="44" width="184" height="120" rx="14" fill="#0D3B14" opacity="0.25"/>
    <rect x="32" y="40" width="184" height="120" rx="14" fill="url(#paper)"/>
    <!-- title bar -->
    <path d="M32 54 a14 14 0 0 1 14 -14 h156 a14 14 0 0 1 14 14 v10 h-184 z" fill="#1E9E33"/>
    <circle cx="52" cy="52" r="4.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="68" cy="52" r="4.5" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="84" cy="52" r="4.5" fill="#FFFFFF" opacity="0.4"/>
    <!-- address bar -->
    <rect x="100" y="46" width="104" height="12" rx="6" fill="#FFFFFF" opacity="0.85"/>
    <!-- globe inside browser -->
    <g fill="none" stroke="#1E9E33" stroke-width="6" stroke-linecap="round">
      <circle cx="124" cy="110" r="30"/>
      <ellipse cx="124" cy="110" rx="14" ry="30"/>
      <path d="M94 110 h60"/>
      <path d="M99 92 h50"/>
      <path d="M99 128 h50"/>
    </g>
  </g>

  <!-- extraction arrow -->
  <path d="M124 168 v22" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
  <path d="M108 178 l16 18 16 -18" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- extracted markdown lines -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
    <line x1="72" y1="212" x2="184" y2="212"/>
    <line x1="88" y1="230" x2="168" y2="230" opacity="0.7"/>
  </g>
  <circle cx="64" cy="230" r="4.5" fill="#FFFFFF" opacity="0.7"/>
</svg>
